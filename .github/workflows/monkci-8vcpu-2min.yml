name: monkci-8vcpu-2min
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/monkci-8vcpu-2min.yml
jobs:
  run:
    runs-on: monkci-ubuntu-24.04-2
    steps:
      - name: 2 minute workload (8 vCPU)
        run: |
          echo "start $(date -u +%FT%TZ) host=$(hostname) nproc=$(nproc)"
          sleep 120
          echo "done $(date -u +%FT%TZ)"
