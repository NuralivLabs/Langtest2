name: monkci-32vcpu-4min
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/monkci-32vcpu-4min.yml
jobs:
  run:
    runs-on: monkci-ubuntu-24.04-32
    steps:
      - name: 4 minute workload (32 vCPU)
        run: |
          echo "start $(date -u +%FT%TZ) host=$(hostname) nproc=$(nproc)"
          sleep 240
          echo "done $(date -u +%FT%TZ)"
