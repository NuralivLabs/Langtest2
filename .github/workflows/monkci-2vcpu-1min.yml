name: monkci-2vcpu-1min
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/monkci-2vcpu-1min.yml
jobs:
  run:
    runs-on: monkci-ubuntu-latest
    steps:
      - name: 1 minute workload (2 vCPU)
        run: |
          echo "start $(date -u +%FT%TZ) host=$(hostname) nproc=$(nproc)"
          sleep 60
          echo "done $(date -u +%FT%TZ)"
