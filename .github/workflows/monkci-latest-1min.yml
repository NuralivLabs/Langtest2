name: monkci-latest-1min
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/monkci-latest-1min.yml
jobs:
  run:
    runs-on: monkci-ubuntu-24.04-2
    steps:
      - name: 1 minute successful workload (monkci-ubuntu-latest)
        run: |
          echo "start $(date -u +%FT%TZ) host=$(hostname) nproc=$(nproc)"
          sleep 60
          echo "done $(date -u +%FT%TZ) — success"
